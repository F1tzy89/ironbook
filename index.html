<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ironbook</title>
<meta name="description" content="Your workout plan, set-by-set logging and calorie tracking.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ironbook">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Iron & rust palette: slate neutrals, iron-oxide accent. Layout: native-iOS-style fitness app modelled on Hevy — large titles, grouped grey background, white rounded sections, blue accent, bottom tab bar. */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#eceef1; --fill:#e8eaee; --ink:#14161a; --muted:#80868f; --line:#e1e4e8;
  --accent:#c4471c; --accent-ink:#ffffff; --accent-soft:#fbeae3;
  --good:#2f9e5b; --good-soft:#e2f4e9; --warn:#d98a0b; --bad:#d6342c;
  --p-red:#e5323a; --p-blue:#1f6fe0; --p-yellow:#f2c230; --p-green:#2ea44f; --p-white:#f4f5f7; --p-black:#2a2f38; --p-silver:#a9b1bc;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0d10; --surface:#17191d; --surface-2:#22252b; --fill:#262a30; --ink:#f3f4f6; --muted:#8b919a; --line:#2e3238;
  --accent:#ff7a45; --accent-ink:#1a0d06; --accent-soft:#3a1f14;
  --good:#3ccf7a; --good-soft:#123222; --warn:#ffb340; --bad:#ff5a4f;
  --p-red:#f0475c; --p-blue:#4d8dff; --p-yellow:#f2c230; --p-green:#34c472; --p-white:#e9ecf1; --p-black:#4a5260; --p-silver:#8a94a2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d10; --surface:#17191d; --surface-2:#22252b; --fill:#262a30; --ink:#f3f4f6; --muted:#8b919a; --line:#2e3238;
  --accent:#ff7a45; --accent-ink:#1a0d06; --accent-soft:#3a1f14;
  --good:#3ccf7a; --good-soft:#123222; --warn:#ffb340; --bad:#ff5a4f;
  --p-red:#f0475c; --p-blue:#4d8dff; --p-yellow:#f2c230; --p-green:#34c472; --p-white:#e9ecf1; --p-black:#4a5260; --p-silver:#8a94a2; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.38;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-block:12px calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:600;font-size:16px;background:var(--fill);text-align:center;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%;display:block}
.btn.ghost{background:var(--fill)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:8px}
.btn:disabled{opacity:.45}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--fill);white-space:nowrap;border:0}
button.chip{min-height:32px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.pr{background:#fff3cd;color:#8a5a00}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ph-foundation{--ph:var(--good)} .ph-build{--ph:var(--warn)} .ph-peak{--ph:var(--bad)} .ph-deload{--ph:var(--accent)}
.chip.ph{background:var(--fill)}
.chip.ph .dot{background:var(--ph)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
input.t,select.t,textarea.t{border:0;background:var(--fill);border-radius:10px;padding:11px 12px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
textarea.t{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.exrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0;padding-top:0}
.exrow:last-child{padding-bottom:0}
.exrow .rx{font-size:15px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.exrow .meta{grid-column:1/-1;font-size:14px;color:var(--muted)}
.exrow .meta b{color:var(--accent);font-weight:600}
.donecard{}
.prb{position:absolute;top:-6px;right:-6px;background:#ffcc00;color:#000;font-size:9px;font-weight:800;border-radius:6px;padding:1px 4px}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.strip button{border:0;border-radius:8px;padding:8px 0 6px;background:var(--fill);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;font-weight:600;border-bottom:3px solid var(--ph)}
.strip button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.strip button[aria-pressed="true"] small{color:var(--accent-ink)}
.strip small{font-size:9px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:0;border-radius:var(--r);padding:12px;min-width:0;color:var(--ink)}
.stat b{display:block;font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.delta{font-size:13px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.done i{background:var(--good)}
.mrow{display:grid;grid-template-columns:92px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.mrow .bar{height:8px}
.rec-good i{background:var(--good)} .rec-mid i{background:var(--warn)} .rec-low i{background:var(--bad)}
.band{position:absolute;top:0;bottom:0;background:var(--good-soft)}
.mrow .bar i{position:relative}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:12px;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;border:0;background:transparent;max-width:100%}
.cal .d.has{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.libitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);padding:10px 14px}
.libgroup{border-radius:var(--r);overflow:hidden;background:var(--surface)}
.libgroup .libitem:first-child{border-top:0}
.libitem svg{width:48px;height:48px;flex:none;background:var(--fill);border-radius:50%}
.libitem div{min-width:0}
.libitem b{font-weight:600}
.fig{width:100%;max-width:100%;aspect-ratio:240/220;background:var(--surface);border-radius:var(--r);display:block}
svg .bone{stroke:var(--ink);stroke-width:7;stroke-linecap:round;fill:none}
svg .bone.back{stroke:var(--muted)}
svg .head{fill:var(--ink)}
svg .gear{stroke:var(--accent);fill:none;stroke-width:4;stroke-linecap:round}
svg .gearf{fill:var(--accent)}
svg .floor{stroke:var(--line);stroke-width:3}
svg .prop{fill:var(--muted);opacity:.4}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.barbell{display:flex;align-items:center;justify-content:center;gap:2px;min-height:110px;overflow-x:auto;padding:6px 0}
.barbell .sleeve{height:10px;background:var(--p-silver);border-radius:3px;flex:none}
.barbell .shaft{height:6px;width:56px;background:var(--p-silver);flex:none}
.plate{width:14px;border-radius:3px;flex:none;display:grid;place-items:center}
.plate span{writing-mode:vertical-rl;font-size:9px;font-weight:700}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photos button{border:0;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:var(--fill);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
.photos small{position:absolute;left:4px;bottom:4px;background:rgb(0 0 0 / .6);color:#fff;font-size:10px;padding:1px 5px;border-radius:5px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
table.tbl th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 4px}
table.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* rest timer (bottom bar, Hevy style) */
#rest{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:24}
#rest .in{max-width:600px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
#rest .box{background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;box-shadow:0 6px 30px rgb(0 0 0 / .18)}
#rest .t{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:72px}
#rest .track{grid-column:1/-1;height:4px;border-radius:9px;background:var(--fill);overflow:hidden}
#rest .track i{display:block;height:100%;background:var(--accent)}
#rest .ctl{display:flex;gap:6px;justify-content:flex-end}
#rest .ctl button{border:0;border-radius:8px;padding:8px 12px;background:var(--fill);font-weight:600;font-size:15px}
#rest .ctl button.skip{background:var(--accent);color:var(--accent-ink)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .scrim{position:absolute;inset:0;background:rgb(0 0 0 / .4)}
#sheet .panel{position:relative;background:var(--bg);border-radius:14px 14px 0 0;max-height:92%;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:600px;width:100%;margin:0 auto}
#sheet .panel::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
#sheet .panel .wrap{padding-block:10px}
.sheethead{display:flex;align-items:flex-start;gap:12px}
.x{margin-left:auto;border:0;background:var(--fill);border-radius:50%;width:30px;height:30px;font-size:18px;line-height:1;flex:none;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:50;background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .18)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.empty{background:var(--surface);border-radius:var(--r);padding:16px;color:var(--muted);font-size:15px}
.callout{background:var(--accent-soft);border-radius:var(--r);padding:14px}
.err{color:var(--bad);font-size:14px}
details.acc{background:var(--surface);border-radius:var(--r);min-width:0}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;align-items:center;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none}
details.acc[open]>summary::after{transform:rotate(45deg)}
details.acc>.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
details.acc>summary .sub{font-weight:400;color:var(--muted);font-size:14px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:12px;padding:14px 16px}
.opt b{font-size:17px;font-weight:600}
.opt span{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wizbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.wizbar i{height:4px;border-radius:4px;background:var(--line)}
.wizbar i.on{background:var(--accent)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{aspect-ratio:1;max-width:100%;border-radius:50%;border:0;background:var(--surface);font-weight:700;font-size:15px}
.daypick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.actlist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.actlist button{display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:14px 16px;font-size:17px;text-align:left;width:100%}
.actlist button:first-child{border-top:0}
.actlist button.danger{color:var(--bad)}
.actlist button .tag{width:28px;font-weight:800;text-align:center}
.more{border:0;background:transparent;border-radius:8px;width:36px;height:32px;font-size:20px;line-height:1;flex:none;color:var(--ink);font-weight:700}
.hint{font-size:14px;color:var(--muted)}
.hint b{color:var(--accent)}
.listbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:13px 16px}
.listbtn div{min-width:0;flex:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0;padding-top:0}
.kv b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.big{font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.textlink{background:none;border:0;color:var(--accent);font-size:16px;font-weight:600;padding:8px}
/* week schedule */
.sched{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.sched>div{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.sched>div:first-child{border-top:0}
.sched .dw{font-weight:700;font-size:14px;color:var(--muted)}
.sched .today .dw{color:var(--accent)}
.sched .rest{color:var(--muted)}
.sched .ok{color:var(--good);font-weight:600;font-size:14px}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.weekdots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.weekdots i{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.weekdots i.plan{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.weekdots i.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.weekdots i.today{outline:2px solid var(--ink);outline-offset:2px}
.weekdots svg{width:14px;height:14px}
/* ===== live workout (Hevy-style) ===== */
.wtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.wtop .bar1{display:flex;align-items:center;gap:10px}
.wtop .title{font-weight:600;font-size:17px;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtop .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wtop .stats3 span{display:block;font-size:12px;color:var(--muted)}
.wtop .stats3 b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.wtop .stats3 b.blue{color:var(--accent)}
.exblock{background:var(--surface);border-radius:var(--r);padding:14px 0 10px;display:flex;flex-direction:column;gap:8px}
.exblock.ss{box-shadow:inset 4px 0 0 var(--accent)}
.exblock .exhead{display:flex;align-items:center;gap:10px;padding:0 10px 0 14px}
.exblock .exhead svg{width:38px;height:38px;flex:none;background:var(--fill);border-radius:50%}
.exblock .exname{background:none;border:0;padding:0;text-align:left;color:var(--accent);font-weight:600;font-size:17px;flex:1;min-width:0}
.exblock .notein{border:0;background:transparent;padding:0 14px;font-size:15px;color:var(--ink);width:100%}
.exblock .notein::placeholder{color:var(--muted)}
.exblock .restbtn{background:none;border:0;padding:0 14px;color:var(--accent);font-size:15px;font-weight:500;text-align:left;display:flex;align-items:center;gap:6px}
.exblock .restbtn svg{width:16px;height:16px}
.exblock .target{padding:0 14px;font-size:14px;color:var(--muted)}
.exblock .target b{color:var(--ink);font-weight:600}
.sslabel{padding:0 14px;font-size:13px;font-weight:600;color:var(--accent)}
.sets{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:40px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center;padding:4px 10px}
.setrow.hd{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;padding-block:2px}
.setrow.hd span{text-align:center}
.setrow.done{background:var(--good-soft)}
.setrow .setno{height:32px;border:0;background:transparent;font-weight:700;font-size:15px;border-radius:6px}
.setrow .setno.w{color:var(--warn)} .setrow .setno.d{color:var(--accent)} .setrow .setno.f{color:var(--bad)}
.setrow .prev{border:0;background:transparent;color:var(--muted);font-size:14px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 0}
.setrow input{border:0;background:var(--fill);border-radius:7px;height:32px;text-align:center;font-weight:600;font-size:16px;width:100%;min-width:0;color:var(--ink);font-variant-numeric:tabular-nums}
.setrow.done input{background:transparent}
.setrow input::placeholder{color:var(--muted);font-weight:500}
.tick{height:32px;width:36px;justify-self:center;border-radius:7px;border:0;background:var(--fill);display:grid;place-items:center;position:relative;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good);color:#fff}
.tick svg{width:18px;height:18px}
.addset{margin:2px 14px 0;border:0;background:var(--fill);border-radius:8px;padding:9px;font-weight:600;font-size:15px}
.wfoot{display:flex;flex-direction:column;gap:10px}
.btn.redtext{background:var(--fill);color:var(--bad)}
.brand{display:flex;align-items:center;gap:10px}
.brand .word{font-size:22px;font-weight:800;letter-spacing:-.03em}
.brand .word span{color:var(--accent)}
.logo{flex:none;display:block}
.logo .bg{fill:var(--accent)} .logo .fg{fill:var(--accent-ink)}
.hero-logo{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:12px 0 4px}
.hero-logo .word{font-size:30px}
.scanbox{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .guide{position:absolute;left:6%;right:6%;top:24%;bottom:24%;border:3px solid rgb(255 255 255 / .9);border-radius:12px;box-shadow:0 0 0 999px rgb(0 0 0 / .38);transition:border-color .15s}
.scanbox.hit .guide{border-color:var(--good);box-shadow:0 0 0 999px rgb(0 0 0 / .38),inset 0 0 0 999px rgb(47 158 91 / .25)}
.scanline{position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scanmove 1.6s ease-in-out infinite alternate}
@keyframes scanmove{from{top:12%}to{top:88%}}
.scanbox.hit .scanline{display:none}
.torch{position:absolute;right:10px;top:10px;border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:rgb(0 0 0 / .55);color:#fff}
.torch.on{background:#ffd60a;color:#000}
.foodimg{width:56px;height:56px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
body.resting main{padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))}
body.resting .toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.target{padding:0 14px;font-size:14px;color:var(--muted)}
.target b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function animate(svg,id){
  cancelAnimationFrame(animRaf);
  const ex=X(id);if(!ex.fam||!FAM[ex.fam]) return;
  const [A,B]=FAM[ex.fam],period=2600,t0=performance.now();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick=(now)=>{
    if(!svg.isConnected) return;
    const ph=((now-t0)%period)/period;
    let t=ph<.12?0:ph<.5?(ph-.12)/.38:ph<.62?1:1-(ph-.62)/.38;
    t=.5-.5*Math.cos(Math.PI*t);
    if(reduce) t=0;
    const q=lerpPose(A,B,t);
    svg.querySelectorAll("[data-l]").forEach(l=>{const[a,b]=l.dataset.l.split("-");l.setAttribute("x1",q[a][0]);l.setAttribute("y1",q[a][1]);l.setAttribute("x2",q[b][0]);l.setAttribute("y2",q[b][1]);});
    const hd=svg.querySelector("[data-j=h]");hd.setAttribute("cx",q.h[0]);hd.setAttribute("cy",q.h[1]);
    const g=svg.querySelector("[data-g]");
    if(g){const gp=(ex.fam==="bridge")?[q.p[0],q.p[1]-14]:(ex.fam==="legpress"||ex.fam==="legcurl"||ex.fam==="legext")?q.f:q.w;g.setAttribute("transform",`translate(${gp[0]} ${gp[1]})`);
      const cl=g.querySelector("line[style]");if(cl&&(ex.fam==="facepull"||ex.fam==="pushdown")){cl.setAttribute("x2",210-gp[0]);cl.setAttribute("y2",(ex.fam==="pushdown"?20:58)-gp[1]);}}
    if(!reduce) animRaf=requestAnimationFrame(tick);
  };
  animRaf=requestAnimationFrame(tick);
}

async function readGist(){
  const g=await gh(`/gists/${syncCfg.gistId}`);const f=g.files&&g.files[GIST_FILE];if(!f)return null;
  let content=f.content;if(f.truncated){content=await (await fetch(f.raw_url)).text();}
  return JSON.parse(content);
}
function syncErrText(e){const c=e&&e.code;return c==="auth"?"GitHub rejected the token. Check it has the “gist” permission and hasn't expired.":c==="pass"?"Wrong passphrase: it doesn't match the one used on your other device.":c==="missing"?"The sync file was deleted on GitHub. Connect again to create a new one.":navigator.onLine===false?"You're offline. Changes are saved on this phone and will sync later.":"Couldn't reach GitHub. Changes are saved on this phone and will sync later.";}
function adoptRemote(remote){
  const keepActive=state.active&&!remote.active?state.active:null;
  state=normalize(remote);if(keepActive)state.active=keepActive;
  try{localStorage.setItem(LSKEY,JSON.stringify(state));}catch(e){}
}
async function pullSync(){
  if(!syncOn()||syncBusy)return;
  syncBusy=true;
  try{
    const env=await readGist();
    if(env&&(env.updatedAt||0)>(state.updatedAt||0)){adoptRemote(await decryptEnvelope(env,syncCfg.pass));render();}
    else if(!env||(state.updatedAt||0)>(env.updatedAt||0)){syncBusy=false;await pushSync();return;}
    syncOk=true;syncErr="";syncCfg.last=Date.now();saveSyncCfg();
  }catch(e){syncOk=false;syncErr=syncErrText(e);}
  syncBusy=false;
}
async function pushSync(){
  if(!syncOn())return;
  if(syncBusy){syncPending=true;return;}
  syncBusy=true;
  try{
    const content=await encryptState(state);
    await gh(`/gists/${syncCfg.gistId}`,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content}}})});
    syncOk=true;syncErr="";syncCfg.last=Date.now();saveSyncCfg();
  }catch(e){syncOk=false;syncErr=syncErrText(e);}
  syncBusy=false;
  if(syncPending){syncPending=false;pushSync();}
}
async function connectSync(token,pass){
  syncCfg={...syncCfg,token:token.trim(),pass,gistId:null};
  const id=await findGist();
  if(id){
    syncCfg.gistId=id;const env=await readGist();
    if(env){const remote=await decryptEnvelope(env,pass);syncCfg.salt=env.salt;
      if((remote.updatedAt||0)>(state.updatedAt||0)||!state.setupDone)adoptRemote(remote);}
    saveSyncCfg();await pushSync();return id?"joined":"created";
  }
  syncCfg.salt=null;
  const content=await encryptState(state);
  const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content}}})});
  syncCfg.gistId=g.id;saveSyncCfg();syncOk=true;syncCfg.last=Date.now();saveSyncCfg();
  return "created";
}
function initSync(){
  if(!syncOn())return;
  pullSync();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pullSync();else if(saveTimer){clearTimeout(saveTimer);pushSync();}});
  window.addEventListener("online",()=>pushSync());
}

const PDB={db:null,urls:{}};
function idb(){if(PDB.db)return Promise.resolve(PDB.db);return new Promise((res,rej)=>{const r=indexedDB.open("ironbook",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>{PDB.db=r.result;res(PDB.db);};r.onerror=()=>rej(r.error);});}
async function idbTx(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("photos",mode);const req=fn(tx.objectStore("photos"));tx.oncomplete=()=>res(req&&req.result);tx.onerror=()=>rej(tx.error);});}
const idbPut=(id,blob)=>idbTx("readwrite",s=>s.put(blob,id));

const idbDel=id=>idbTx("readwrite",s=>s.delete(id));

/* ============ HELPERS ============ */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const U=()=>state.profile.units;
const DU=()=>U()==="kg"?"km":"mi";
const fmtNum=n=>(Math.round(n*10)/10).toLocaleString();
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:0;};
const fmtDate=iso=>new Date(iso.length===10?iso+"T12:00":iso).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const fmtRest=s=>s>=60?`${Math.floor(s/60)}:${pad(s%60)}`:`${s}s`;
const fmtDur=min=>min>=60?`${Math.floor(min/60)}h ${min%60}m`:`${min} min`;
function daysBetween(a,b){return Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);}
function rawWeek(){return cycleWeekIndex(new Date())+1;}
function currentWeek(){return Math.max(1,Math.min(8,rawWeek()));}
const dowOf=d=>(d.getDay()+6)%7;
function weekdaysSorted(){return [...(state.profile.weekdays||[])].sort((a,b)=>a-b);}
function cycleWeekIndex(date){const a=weekStart(new Date(state.profile.cycleStart+"T12:00")),b=weekStart(date);return Math.round((b-a)/(7*864e5));}
/* The rotation counts scheduled days from the day the plan started, so the first session is always the first workout (Push A). */
function workoutKeyFor(date){
  const iso=localISO(date),p=state.profile;if(iso<p.cycleStart)return null;
  const wd=weekdaysSorted();if(!wd.includes(dowOf(date)))return null;
  const rot=ROTATION[p.split]||ROTATION.pp;let n=0;const d=new Date(p.cycleStart+"T12:00"),end=new Date(iso+"T12:00");
  while(d<end){if(wd.includes(dowOf(d)))n++;d.setDate(d.getDate()+1);}
  return rot[n%rot.length];
}
function doneOn(iso){return state.sessions.some(s=>localISO(new Date(s.date))===iso);}
function weekSchedule(){const ws=weekStart(new Date());return [0,1,2,3,4,5,6].map(i=>{const d=new Date(ws);d.setDate(d.getDate()+i);const iso=localISO(d);return {d,iso,dow:i,key:workoutKeyFor(d),done:doneOn(iso),today:iso===todayISO(),past:iso<todayISO()};});}
function nextWorkout(){const t=new Date();t.setHours(12,0,0,0);for(let i=0;i<14;i++){const d=new Date(t);d.setDate(d.getDate()+i);const key=workoutKeyFor(d);if(key&&!(i===0&&doneOn(todayISO())))return {d,key,days:i};}return null;}
function weekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function sessionsInWeek(offset){const ws=weekStart(new Date());ws.setDate(ws.getDate()-7*offset);const we=new Date(ws);we.setDate(we.getDate()+7);return state.sessions.filter(s=>{const d=new Date(s.date);return d>=ws&&d<we;});}
function streakWeeks(){
  if(!state.sessions.length) return 0;
  const set=new Set(state.sessions.map(s=>weekStart(new Date(s.date)).getTime()));
  let w=weekStart(new Date()),n=0;
  if(!set.has(w.getTime())) w.setDate(w.getDate()-7);
  while(set.has(w.getTime())){n++;w.setDate(w.getDate()-7);}
  return n;
}
const isWork=st=>st.done&&st.t!=="w";
function e1rm(w,r){w=num(w);r=num(r);if(!(w>0&&r>0))return 0;if(r===1)return w;return w*(1+Math.min(r,15)/30);}
function exRecords(id,exclude){
  const rec={bestW:0,bestE1:0,bestVol:0,bestReps:0,sessions:0,repMax:{},hist:[]};
  for(const s of state.sessions){if(s===exclude)continue;
    for(const e of s.exercises){if(e.ex!==id)continue;
      let sb=0,sw=0,any=false;
      for(const st of e.sets){if(!isWork(st))continue;any=true;
        const w=num(st.w),r=num(st.r);
        if(w>rec.bestW)rec.bestW=w;if(r>rec.bestReps)rec.bestReps=r;
        const v=w*r;if(v>rec.bestVol)rec.bestVol=v;
        const x=e1rm(w,r);if(x>rec.bestE1)rec.bestE1=x;if(x>sb)sb=x;if(w>sw)sw=w;
        if(r>=1&&r<=12&&w>0){if(!rec.repMax[r]||w>rec.repMax[r])rec.repMax[r]=w;}
      }
      if(any){rec.sessions++;rec.hist.push({d:s.date,e1:sb,w:sw,r:Math.max(0,...e.sets.filter(isWork).map(x=>num(x.r)))});}
    }}
  return rec;
}
function lastPerf(id){for(let i=state.sessions.length-1;i>=0;i--){const e=state.sessions[i].exercises.find(x=>x.ex===id);if(e&&e.sets.some(s=>s.done))return {sets:e.sets.filter(s=>s.done),session:state.sessions[i]};}return null;}
function latestWeight(){const w=state.weighins;return w.length?w[w.length-1].v:null;}
function roundTo(v,step){return Math.round(v/step)*step;}
function repRange(reps){const m=String(reps).match(/(\d+)\D+(\d+)/);if(m)return[+m[1],+m[2]];const n=parseInt(reps);return[n||8,n||8];}
function suggestion(id,reps,week){
  const k=kindOf(id);if(k!=="strength")return null;
  const ph=PHASES[week||(state.active&&state.active.week)||currentWeek()]||"build",rir=PHASE_RIR[ph];
  const [lo,hi]=repRange(reps);
  const lp=lastPerf(id);
  const work=lp?lp.sets.filter(s=>s.t!=="w"&&num(s.w)>0&&num(s.r)>0):[];
  if(!work.length){
    const m=exMax(id);if(!m)return null;
    const raw=loadFor(m.v,lo,rir+1),w=roundLoad(id,raw);
    if(X(id).equip==="barbell"&&raw<state.settings.bar*0.85) return {w,start:true,light:true,why:`Your estimated working weight (about ${fmtNum(Math.round(raw))} ${U()}) is lighter than the empty ${state.settings.bar} ${U()} bar. Use a lighter bar if your gym has one, or tap ⋯ › Replace exercise and pick the dumbbell version.`};
    return {w,start:true,why:`Estimated from ${m.src}: a weight you can lift for ${lo}–${hi} reps with ${rir+1} reps to spare. It's set slightly light for the first session; adjust so the last 2 reps feel hard but clean.`};
  }
  const lastEx=lp.session.exercises.find(x=>x.ex===id);
  const top=Math.max(...work.map(s=>num(s.w))),topSets=work.filter(s=>num(s.w)===top);
  const e1=Math.max(...work.map(s=>setE1(s.w,s.r,lastEx&&lastEx.rpeLog)));
  const calc=roundLoad(id,loadFor(e1,lo,rir));
  const inc=Math.max(roundLoad(id,top*1.025)-top,{barbell:U()==="kg"?2.5:5,dumbbell:U()==="kg"?(top<10?1:2.5):5,kettlebell:U()==="kg"?4:5,cable:U()==="kg"?2.5:5,machine:U()==="kg"?5:10}[X(id).equip]||2.5);
  const same=lastEx&&lastEx.reps===reps;
  const minR=Math.min(...topSets.map(s=>num(s.r)));
  if(!same) return {w:calc,up:calc>top,down:calc<top,why:`The rep target changed from last time (${lastEx?lastEx.reps:"?"} → ${reps}). Based on your last session, about ${fmtNum(calc)} ${U()} fits ${lo}–${hi} reps.`};
  if(minR>=hi) {const w=Math.max(top+inc,Math.min(calc,top+inc*2));return {w,up:true,why:`You hit ${hi}+ reps on every set last time, so it's time to add weight.`};}
  if(minR<lo) {const w=Math.min(top,calc);return {w,down:w<top,why:w<top?`A set fell short of ${lo} reps last time. A little lighter lets you hit the target with good form.`:`A set fell short of ${lo} reps last time. Stay here until every set reaches ${lo}+.`};}
  return {w:top,why:`Same weight. Beat last time's reps (${topSets.map(s=>num(s.r)).join(", ")}); once every set reaches ${hi}, the weight goes up.`};
}

function recovery(){
  const now=Date.now(),res={};MUSCLES.forEach(m=>res[m]={pct:100,last:null});
  for(const s of state.sessions){
    const hrs=(now-new Date(s.date).getTime())/3.6e6;if(hrs>24*8)continue;
    for(const e of s.exercises){const mg=X(e.ex).mg||[];const sets=e.sets.filter(isWork).length;if(!sets)continue;
      mg.forEach((m,i)=>{if(!res[m])return;const load=sets*(i===0?1:.5);const need=Math.min(144,36+load*10);const pct=Math.max(0,Math.min(100,hrs/need*100));
        if(pct<res[m].pct)res[m].pct=pct;if(!res[m].last||s.date>res[m].last)res[m].last=s.date;});}
  }
  return res;
}

function rmRows(w,r){

/* ---- barcode maths ---- */
function gtinValid(c){
  if(!/^(\d{8}|\d{12,14})$/.test(c))return false;
  const d=c.split("").map(Number),check=d.pop();let s=0;
  d.reverse().forEach((n,i)=>{s+=n*(i%2===0?3:1);});
  return (10-s%10)%10===check;
}
function upcEtoA(e){
  if(!/^[01]\d{7}$/.test(e))return null;
  const ns=e[0],d=e.slice(1,7),ck=e[7],l=d[5];let m;
  if("012".includes(l))m=d[0]+d[1]+l+"0000"+d[2]+d[3]+d[4];
  else if(l==="3")m=d[0]+d[1]+d[2]+"00000"+d[3]+d[4];
  else if(l==="4")m=d[0]+d[1]+d[2]+d[3]+"00000"+d[4];
  else m=d[0]+d[1]+d[2]+d[3]+d[4]+"0000"+l;
  return ns+m+ck;
}
/* Clean up a decoder result. Returns a checksum-verified code, or null to ignore the read. */
function normCode(raw,format){
  const c=String(raw||"").replace(/\s/g,"");if(!/^\d+$/.test(c))return null;
  const f=String(format||"").toLowerCase();
  if(f==="upc_e"&&c.length===8){const a=upcEtoA(c);return a&&gtinValid(a)?a:null;}
  if([8,12,13,14].includes(c.length))return gtinValid(c)?c:null;
  return f==="code_128"&&c.length>=6?c:null;
}
function codeVariants(code){
  const c=String(code).replace(/\D/g,""),out=[],add=x=>{if(x&&!out.includes(x))out.push(x);};
  add(c);
  if(c.length===12)add("0"+c);
  if(c.length===13&&c[0]==="0")add(c.slice(1));
  if(c.length===14&&c[0]==="0"){add(c.slice(1));if(c[1]==="0")add(c.slice(2));}
  if(c.length===8){const a=upcEtoA(c);if(a&&gtinValid(a)){add(a);add("0"+a);}}
  return out;
}
const stripZeros=c=>String(c||"").replace(/^0+/,"");

const BC_FORMATS=["ean_13","ean_8","upc_a","upc_e","code_128"];

function getDetector(){
  if(bdP)return bdP;
  bdP=(async()=>{
    if(window.BarcodeDetector&&window.BarcodeDetector.getSupportedFormats){
      try{const sup=await window.BarcodeDetector.getSupportedFormats();const f=BC_FORMATS.filter(x=>sup.includes(x));
        if(f.includes("ean_13"))return {kind:"native",d:new window.BarcodeDetector({formats:f})};}catch(e){}
    }
    try{
      await loadScript("https://cdn.jsdelivr.net/npm/barcode-detector@3.0.8/dist/iife/ponyfill.js");
      const API=window.BarcodeDetectionAPI;

        const c=document.createElement("canvas");c.width=c.height=16;await d.detect(c);

      }

    return {kind:"zxjs",d:{detect:async(src)=>{
      let c=src;if(!(src instanceof HTMLCanvasElement)){c=document.createElement("canvas");c.width=src.width;c.height=src.height;c.getContext("2d").drawImage(src,0,0);}
      try{const r=reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))));const t=r&&r.getText();
        return t?[{rawValue:t,format:String(Z.BarcodeFormat[r.getBarcodeFormat()]||"").toLowerCase()}]:[];}catch(e){return [];}
    }}};

function parseLabel(text){
  const T=text.replace(/(\d),(\d)/g,"$1.$2");
  const lines=T.split(/\n/);const nums=s=>(s.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  let kcal=[],prot=[],serving=null;const per100=/100\s*(g|ml)/i.test(T);
  for(const L of lines){
    if(/kcal/i.test(L)){const m=[...L.matchAll(/(\d+(?:\.\d+)?)\s*kcal/gi)].map(x=>+x[1]);kcal.push(...(m.length?m:nums(L).filter(v=>v<1000)));}
    else if(/calories/i.test(L)&&!/from fat/i.test(L)){const n=nums(L).filter(v=>v>0&&v<2000);if(n.length&&!kcal.length)kcal.push(...n);}
    if(/prot/i.test(L)){const n=nums(L).filter(v=>v<100);if(n.length)prot.push(...n);}
    if(serving==null){const sm=L.match(/(serving|portion|serv)[^\n]*?(\d+(?:\.\d+)?)\s*(g|ml)\b/i)||L.match(/()(\d+(?:\.\d+)?)\s*(g|ml)\s*(serving|portion)/i);if(sm&&+sm[2]!==100)serving=+sm[2];}
  }
  let ks=null,ps=null,k100=null,p100=null;
  if(per100){k100=kcal[0]??null;p100=prot[0]??null;ks=kcal[1]??null;ps=prot[1]??null;}else{ks=kcal[0]??null;ps=prot[0]??null;}
  if(ks==null&&k100!=null){if(serving){ks=k100*serving/100;ps=p100!=null?p100*serving/100:null;}else{serving=100;ks=k100;ps=p100;}}
  return {name:null,serving_g:serving,kcal_serving:ks,protein_serving:ps};
}
async function ocrLabel(file){
  const msg=t=>{const m=document.getElementById("busyMsg");if(m)m.textContent=t;};
  msg("Loading the text reader (about 10 MB the first time)…");
  await loadTess();
  const img=await fileToImage(file);const sc=Math.min(2,1800/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const ctx=c.getContext("2d");ctx.filter="grayscale(1) contrast(1.4)";ctx.drawImage(img,0,0,c.width,c.height);
  const res=await Tesseract.recognize(c,"eng",{logger:m=>{if(m.status==="recognizing text")msg(`Reading the label… ${Math.round((m.progress||0)*100)}%`);}});
  return parseLabel(res.data.text||"");
}
async function handleLabelPhoto(file,code){

    case "reset-rest":state.settings.restOv={};save();render();break;
    case "plates-for":{const e=E();const w=e.sets.find(s=>s.w)?.w||suggestion(e.ex,e.reps)?.w||"";sheetCtx={type:"plates"};
      openSheet(`<div class="stack"><div class="sheethead"><div class="grow"><p class="eyebrow">${esc(X(e.ex).name)}</p><h2>Plate calculator</h2></div><button class="x" data-act="close-sheet" aria-label="Close">×</button></div><label class="f">Total weight (${U()})<input class="t" id="spc" inputmode="decimal" data-in="splate" value="${esc(w)}"></label><div id="spc-out">${plateResultHTML(w)}</div><p class="small muted">Bar: ${state.settings.bar} ${U()}. Change it in Profile › Tools.</p></div>`);break;}
    case "swap":openPicker("swap",+el.dataset.e);break;
    case "add-ex":openPicker("add");break;
    case "pick":{const id=el.dataset.ex,ctx=sheetCtx;if(!ctx||!A)break;
      if(ctx.mode==="add"){A.exercises.push({ex:id,def:id,reps:kindOf(id)==="time"?"30–60 s":kindOf(id)==="cardio"?"20–40":"8–12",rest:state.settings.restOv[id]||90,rpe:"",rpeLog:"",note:"",ss:false,sets:Array.from({length:kindOf(id)==="cardio"?1:3},()=>({w:"",r:"",done:false,t:"n"}))});}
      else{const e=A.exercises[ctx.ei];const cb=document.getElementById("swapPlan");if(cb&&cb.checked){const def=planDefFor(e.ex);if(def)p.swaps[def]=id;}e.ex=id;e.sets.forEach(s=>{if(!s.done){s.w="";}});}
      closeSheet();save();render();break;}
    case "fin":A.finDone=!A.finDone;save();render();break;
    case "finish":finishWorkout();break;
    case "discard":sheetCtx={type:"discard"};openSheet(`<div class="stack"><div class="sheethead"><div class="grow"><h2>Discard workout?</h2><p class="muted">Nothing you've logged in this workout will be saved.</p></div></div><div class="actlist"><button class="danger" data-act="discard-yes">Discard Workout</button><button data-act="close-sheet">Keep training</button></div></div>`);break;
    case "discard-yes":closeSheet();state.active=null;save();render();keepAwake(false);hideRest();window.scrollTo(0,0);break;
    case "why":{const e=E(),sg=suggestion(e.ex,e.reps);if(!sg)break;sheetCtx={type:"why"};
      openSheet(`<div class="stack"><div class="sheethead"><div class="grow"><p class="small muted">${esc(X(e.ex).name)}</p><h2>${fmtNum(sg.w)} ${U()} × ${esc(e.reps)}</h2></div><button class="x" data-act="close-sheet" aria-label="Close">×</button></div><p>${esc(sg.why)}</p><p class="small muted">Phase: ${PHASEINFO[PHASES[A.week]||"build"].label}, ${PHASEINFO[PHASES[A.week]||"build"].rir}. Enter your real maxes in Profile for sharper numbers.</p><button class="btn primary block" data-act="use-sg" data-e="${el.dataset.e}">Fill empty sets with ${fmtNum(sg.w)} ${U()}</button></div>`);break;}
    case "use-sg":{const e=E(),sg=suggestion(e.ex,e.reps);if(sg)e.sets.forEach(s=>{if(!s.done&&s.t!=="w"&&!s.w)s.w=String(sg.w);});closeSheet();save();render();break;}
    /* nutrition */
    case "scan":openScanner();break;
    case "scan-photo":stopScanner();closeSheet();document.getElementById("barcodeInput").click();break;
    case "code-manual":stopScanner();openManualCode();break;
    case "search-open":openSearch();break;
    case "search-go":searchGo((document.getElementById("sq")||{}).value||"");break;
    case "sr-pick":{const g=el.dataset.g;let f=null;if(g==="common")f=COMMON_FOODS.find(x=>x.cid===el.dataset.i);else{const arr=ui.sr&&ui.sr[g];f=Array.isArray(arr)?arr[+el.dataset.i]:null;}
      if(!f)break;const id=storeFood(f);openAmount(id,f.src==="common"?"Typical values for this food. If you have the packet, its label is more accurate.":f.generic?"USDA reference values for this food.":"");break;}
    case "amt-chip":{const s=document.getElementById("fa-s"),g=document.getElementById("fa-g");if(el.dataset.g){if(g)g.value=el.dataset.g;}else{if(s)s.value=el.dataset.s==".5"?"0.5":el.dataset.s;if(g)g.value="";}updAmount();break;}
    case "torch":toggleTorch();break;
    case "fdc-save":{const k=(document.getElementById("fdc-key").value||"").trim();if(k.length<20){toast("Paste the full key from the USDA email");break;}syncCfg.fdcKey=k;saveSyncCfg();render();toast("USDA key saved");break;}
    case "fdc-clear":delete syncCfg.fdcKey;saveSyncCfg();render();break;
    case "sync-connect":{const t=(document.getElementById("sy-token").value||"").trim(),pw=document.getElementById("sy-pass").value||"",er=document.getElementById("sy-err");
      if(t.length<20){er.textContent="Paste the full GitHub token.";break;}if(pw.length<8){er.textContent="Use a passphrase of at least 8 characters.";break;}
      el.disabled=true;el.textContent="Connecting…";
      connectSync(t,pw).then(r=>{syncOk=true;syncErr="";render();toast(r==="joined"?"Connected to your existing sync":"Sync is on");initSync();}).catch(e=>{syncCfg.gistId=null;saveSyncCfg();er.textContent=syncErrText(e);el.disabled=false;el.textContent="Turn on sync";});break;}
    case "sync-now":pullSync().then(()=>{render();toast(syncErr?syncErr:"Synced");});break;
    case "sync-off":syncCfg={claudeKey:syncCfg.claudeKey};saveSyncCfg();syncOk=false;render();toast("Sync turned off on this phone");break;
    case "ai-save":{const k=(document.getElementById("ai-key").value||"").trim();if(!/^sk-ant-/.test(k)){toast("That doesn't look like an Anthropic API key");break;}syncCfg.claudeKey=k;saveSyncCfg();render();toast("Key saved");break;}
    case "ai-clear":delete syncCfg.claudeKey;saveSyncCfg();render();break;
    case "label-snap":ui.pendingCode=el.dataset.code||"";document.getElementById("labelInput").click();break;
    case "food-open":openFood();break;
    case "describe-open":openDescribe();break;
    case "describe-go":describeGo(document.getElementById("ds-text").value||"");break;
    case "manual-open":openProductForm({},null);break;
    case "code-go":{const c=(document.getElementById("mc-code").value||"").replace(/\D/g,""),er=document.getElementById("mc-err");
      if(c.length<8){er.textContent="Barcodes have 8, 12 or 13 digits. Check you've typed them all.";break;}
      if(!codeVariants(c).some(gtinValid)){er.textContent="That number doesn't add up: one digit is probably mistyped. Check it against the pack.";break;}
      gotCode(c);break;}
    case "food-del":{const d=todayISO();state.food.log[d]=foodDay().filter(f=>f.id!==el.dataset.id);save();openFood();render();break;}
    case "food-pick":openAmount(el.dataset.id);break;
    case "product-edit":{const f=state.food.lib[el.dataset.id];if(f)openProductForm({...f,id:el.dataset.id},f.code);break;}
    case "product-save":{const name=document.getElementById("pf-name").value.trim(),g=num(document.getElementById("pf-g").value),k=num(document.getElementById("pf-k").value),pr=num(document.getElementById("pf-p").value);
      if(!name||!(k>0)){document.getElementById("pf-err").textContent="Add a name and the calories per serving.";break;}
      const id=sheetCtx.id||("p"+uid());const old=state.food.lib[id]||{};
      const nf={...old,name,serving_g:g>0?g:null,kcal_s:k,prot_s:pr,code:sheetCtx.code||old.code||null,used:Date.now(),src:old.src&&old.kcal_s===k&&old.serving_g===(g>0?g:null)?old.src:"own"};
      if(g>0){nf.kcal_100=Math.round(k/g*100);nf.prot_100=r1(pr/g*100);if(!nf.serving_label)nf.serving_label="serving";}else{delete nf.kcal_100;delete nf.prot_100;}
      state.food.lib[id]=nf;save();openAmount(id);break;}
    case "food-log":{const f=state.food.lib[el.dataset.id];if(!f)break;const sv=amountServings(f);addFoodEntry(f,sv);closeSheet();render();toast(`Logged ${f.name}`);break;}
    case "rest-sub":rest.end=Math.max(Date.now()+1000,rest.end-15000);updRest();break;
    case "rest-add":rest.end+=15000;rest.total+=15;clearInterval(rest.iv);rest.iv=setInterval(updRest,250);updRest();break;
    case "rest-stop":clearInterval(rest.iv);hideRest();break;
    /* library */
    case "howto":openHowto(el.dataset.ex);break;
    case "close-sheet":closeSheet();break;
    case "libgroup":ui.lib.group=el.dataset.g;render();break;
    case "go-custom":ui.tab="profile";ui.open.custom=true;render();setTimeout(()=>{const c=document.querySelector('[data-k="custom"]');if(c)c.scrollIntoView();},0);break;
    /* progress */
    case "ptab":ui.ptab=el.dataset.k;ui.confirm=null;render();break;
    case "show-all":ui.showAll=!ui.showAll;render();break;
    case "cal":{const now=new Date();const m=ui.calMonth||new Date(now.getFullYear(),now.getMonth(),1);ui.calMonth=new Date(m.getFullYear(),m.getMonth()+(+el.dataset.d),1);render();break;}
    case "session":ui.confirm=null;openSession(el.dataset.id);break;
    case "del-session":ui.confirm="del-session";openSession(el.dataset.id);break;
    case "del-session-no":ui.confirm=null;openSession(el.dataset.id);break;
    case "del-session-yes":{const s=state.sessions.find(x=>x.id===el.dataset.id);if(s){markSession(s);state.sessions=state.sessions.filter(x=>x!==s);}ui.confirm=null;closeSheet();save();render();toast("Workout deleted");break;}
    case "add-goal":ui.addGoal=true;render();break;
    case "cancel-goal":ui.addGoal=false;render();break;
    case "goaltype":ui.goalType=el.dataset.v;render();break;
    case "save-goal":saveGoal();break;
    case "del-goal":state.goals.splice(+el.dataset.i,1);save();render();break;
    case "weigh":{const v=num(document.getElementById("wi").value);if(!(v>0)){toast("Enter your weight as a number");break;}
      const d=todayISO();state.weighins=state.weighins.filter(x=>x.d!==d);state.weighins.push({d,v});state.weighins.sort((a,b)=>a.d<b.d?-1:1);if(state.weighins.length>730)state.weighins=state.weighins.slice(-730);save();render();toast("Weigh-in logged");break;}
    case "measure":{const d=todayISO(),m={d};let any=false;MEAS.forEach(([k])=>{const v=num(document.getElementById("m-"+k).value);if(v>0){m[k]=v;any=true;}});
      if(!any){toast("Enter at least one measurement");break;}
      const ex=state.measures.find(x=>x.d===d);if(ex)Object.assign(ex,m);else state.measures.push(m);state.measures.sort((a,b)=>a.d<b.d?-1:1);save();render();toast("Measurements saved");break;}
    case "photo-add":document.getElementById("photoInput").click();break;
    case "photo-sel":{const id=el.dataset.id;const i=ui.photoSel.indexOf(id);if(i>=0)ui.photoSel.splice(i,1);else{ui.photoSel.push(id);if(ui.photoSel.length>2)ui.photoSel.shift();}ui.confirm=null;render();break;}
    case "photo-del":ui.confirm="photo-del";render();break;
    case "photo-del-no":ui.confirm=null;render();break;
    case "photo-del-yes":{const id=ui.photoSel[0];state.photos=state.photos.filter(p=>p.id!==id);ui.photoSel=[];ui.confirm=null;save();render();
      idbDel(id).catch(()=>{});toast("Photo deleted");break;}
    /* profile tools */
    case "cx-save":{const name=document.getElementById("cx-name").value.trim();if(!name){document.getElementById("cx-err").textContent="Give the exercise a name.";break;}
      const m=document.getElementById("cx-m").value,eq=document.getElementById("cx-eq").value,k=document.getElementById("cx-k").value;
      const groupOf={chest:"Chest",shoulders:"Shoulders",triceps:"Arms",biceps:"Arms",back:"Back",quads:"Legs",hamstrings:"Posterior chain",glutes:"Glutes",core:"Core"};
      const id="c-"+uid();state.customEx[id]={name,group:k==="cardio"?"Cardio":groupOf[m],equip:eq,kind:k,mg:k==="cardio"?[]:[m],muscles:MLABEL[m],custom:true};save();render();toast(`Added ${name}`);break;}
    case "cx-del":delete state.customEx[el.dataset.id];save();render();break;
    case "export-csv":exportFile("csv");break;
    case "export-json":exportFile("json");break;
    case "import":document.getElementById("importInput").click();break;
    case "import-no":ui.importData=null;render();break;
    case "import-yes":{const d=ui.importData;ui.importData=null;state=normalize(d);state.active=null;syncAll=true;save();render();toast("Backup restored");break;}
  }
});
document.addEventListener("input",ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.in) return;
  const k=el.dataset.in;
  if(k.startsWith("d-")&&ui.draft){const d=ui.draft;
    if(k==="d-age")d.age=el.value;if(k==="d-w")d.weight=el.value;if(k==="d-h")d.height=el.value;
    if(k==="d-ft"||k==="d-in"){if(k==="d-ft")d.ft=el.value;else d.inch=el.value;const cm=(num(d.ft)*12+num(d.inch))*2.54;d.height=cm>0?cm:"";}
    const b=document.getElementById("bmiLive");if(b)b.textContent=bmiLiveText(draftBMI());return;}
  if(k==="libq"){ui.lib.q=el.value;document.getElementById("liblist").innerHTML=libList(libFiltered(),"howto");return;}
  if(k==="pickq"){const q=el.value.toLowerCase();document.getElementById("picklist").innerHTML=libList(allExIds().filter(id=>(X(id).name+" "+X(id).group+" "+(X(id).muscles||"")).toLowerCase().includes(q)),"pick");return;}
  if(k==="plate"){ui.tools.plate=el.value;document.getElementById("pc-out").innerHTML=plateResultHTML(el.value);return;}
  if(k==="splate"){document.getElementById("spc-out").innerHTML=plateResultHTML(el.value);return;}
  if(k==="warm"){ui.tools.warm=el.value;document.getElementById("wu-out").innerHTML=warmupRows(el.value);return;}
  if(k==="rmW"||k==="rmR"){ui.tools[k]=el.value;document.getElementById("rm-out").innerHTML=rmRows(ui.tools.rmW,ui.tools.rmR);return;}
  if(k==="fa-s"||k==="fa-g"){if(k==="fa-g"&&el.value){const s2=document.getElementById("fa-s");if(s2)s2.value="1";}updAmount();return;}
  if(k==="sq"){clearTimeout(ui.sqT);const v=el.value;ui.sqT=setTimeout(()=>searchLocal(v.trim()),120);return;}
  if(k==="mx"){const v=num(el.value);if(v>0)state.maxes[el.dataset.b]=v;else delete state.maxes[el.dataset.b];save();return;}
  if(k==="snote"){const ss=state.sessions.find(x=>x.id===el.dataset.id);if(ss){ss.note=el.value;markSession(ss);save();}return;}
  if(!state.active) return;
  if(k==="wnote"){state.active.note=el.value;save();return;}
  const e=state.active.exercises[+el.dataset.e];if(!e)return;
  if(k==="note"){e.note=el.value;save();return;}
  if(k==="w"||k==="r"){e.sets[+el.dataset.s][k]=el.value.replace(",",".");save();}
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="barcodeInput"){const f=el.files&&el.files[0];el.value="";if(f)handleBarcodePhoto(f);return;}
  if(el.id==="labelInput"){const f=el.files&&el.files[0];el.value="";if(f)handleLabelPhoto(f,ui.pendingCode||null);return;}
  if(el.id==="photoInput"){const f=el.files&&el.files[0];el.value="";addPhoto(f);return;}
  if(el.id==="importInput"){const f=el.files&&el.files[0];el.value="";if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.sessions)||!d.profile)throw 0;ui.importData=d;ui.open.data=true;render();}catch(e){toast("That file isn't an Ironbook backup");}};r.readAsText(f);return;}
  if(!el.dataset||!el.dataset.in) return;
  const k=el.dataset.in;
  if(k==="liftsel"){ui.liftEx=el.value;render();return;}
  if(k==="bar"){state.settings.bar=num(el.value);save();document.getElementById("pc-out").innerHTML=plateResultHTML(ui.tools.plate);const wo=document.getElementById("wu-out");if(wo)wo.innerHTML=warmupRows(ui.tools.warm);return;}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target&&ev.target.id==="sq"){ev.preventDefault();searchGo(ev.target.value);return;}if(ev.key==="Enter"&&ev.target&&ev.target.id==="mc-code"){ev.preventDefault();const b=document.querySelector('[data-act="code-go"]');if(b)b.click();return;}if(ev.key==="Escape"&&!document.getElementById("sheet").hidden)closeSheet();});
function saveGoal(){
  const t=ui.goalType,val=id=>num(document.getElementById(id)?.value);
  const err=m=>{document.getElementById("g-err").textContent=m;};
  const by=document.getElementById("g-by").value||null;
  let g;
  if(t==="weight"){const s=val("g-start"),tg=val("g-target");if(!(s>0&&tg>0))return err("Enter both your current and target weight.");g={type:"weight",start:s,target:tg,by};
    if(!state.weighins.length){state.weighins.push({d:todayISO(),v:s});}}
  if(t==="lift"){const tg=val("g-target");if(!(tg>0))return err("Enter the weight you want to lift.");g={type:"lift",ex:document.getElementById("g-ex").value,target:tg,by};}
  if(t==="measure"){const s=val("g-start"),tg=val("g-target");if(!(s>0&&tg>0))return err("Enter both the current and target value.");const m=document.getElementById("g-m").value;g={type:"measure",m,start:s,target:tg,by};
    if(!state.measures.some(x=>x[m]!=null)){state.measures.push({d:todayISO(),[m]:s});}}
  if(t==="freq"){const tg=val("g-target");if(!(tg>=1&&tg<=14))return err("Enter a number of workouts between 1 and 14.");g={type:"freq",target:Math.round(tg),by};}
  state.goals.push(g);ui.addGoal=false;save();render();toast("Goal added");
}

/* ============ BOOT ============ */
(function(){const h=(location.hash||"").slice(1);const map={plan:"profile",tools:"profile"};const t=map[h]||h;if(["today","exercises","progress","profile"].includes(t))ui.tab=t;})();
if(state.active) keepAwake(true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){if(SCAN.on||SCAN.stream)stopScanner();}else if(sheetCtx&&sheetCtx.type==="scanner"&&!SCAN.on)openScanner();});
render();
initSync();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
